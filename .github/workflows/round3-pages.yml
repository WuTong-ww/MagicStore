name: Round3 Pages preview and production
on:
  push:
    branches: [codex/round3, main]
    paths: ['scripts/**', 'scenes/**', 'themes/**', 'shaders/**', 'data/**', 'assets/**', 'web/**', 'tools/web_build.py', 'tools/merge_pages.py', '.github/workflows/round3-pages.yml', 'project.godot', 'docs/third-party.md']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: magicstore-pages-root-and-preview
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/codex/round3' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install fonttools==4.60.2 brotli==1.1.0
      - uses: actions/configure-pages@v6
      - name: Install pinned standard Godot and single-thread template
        run: ./scripts/dev/bootstrap.ps1 -WithWebExportTemplates
      - name: Build only the selected public channel
        id: channel
        run: |
          $variant = if ($env:GITHUB_REF -eq 'refs/heads/main') { 'main' } else { 'preview' }
          "variant=$variant" >> $env:GITHUB_OUTPUT
          ./scripts/dev/export-web.ps1 -Variant $variant
          node tests/web/wheel_focus.cjs
          python tests/web/font_artifact.py
      - name: Restore live site and preserve the other channel
        run: |
          python tools/merge_pages.py --variant '${{ steps.channel.outputs.variant }}' --build '.tools/r3-web/builds/${{ steps.channel.outputs.variant }}-optimized/output' --output '.tools/pages-combined'
          if ($LASTEXITCODE -ne 0) { throw 'Pages merge or preservation check failed.' }
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .tools/pages-combined
          retention-days: 90
          include-hidden-files: true
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish complete preserved site
        id: deployment
        uses: actions/deploy-pages@v5
